# The engine pin. `mockspace_version` is the released form, and mockspace has
# cut no release yet, so this tracks the working trunk instead. The launcher
# re-resolves the branch head periodically.
mockspace_branch = "dev"

project_name = "vehje"
crate_prefix = "vehje"
abi_version = 1
mock_dir = "mock"

proc_macro_crates = []
module_crates = []

# Which macro to track per-crate in domain items
primary_domain_macro = "pass"
primary_domain_label = "Passes"

# Layer labels by depth index. R1 finalised the 8-crate compiler
# split (vehje-ir, lex, syntax, resolve, typecheck, schedule,
# codegen, vehje binary). Runtime split lands with R2.
layers = [
  "IR",  # vehje-ir
  "Lex",  # vehje-lex
  "Syntax",  # vehje-syntax
  "Resolve",  # vehje-resolve
  "TypeCheck",  # vehje-typecheck
  "Schedule",  # vehje-schedule
  "CodeGen",  # vehje-codegen
  "Rt:ABI",  # vehje-runtime-abi
  "Rt:Driver",  # vehje-runtime-driver
  "Rt:Tests",  # vehje-runtime-tests
  "CLI",  # vehje (binary)
]

# Domain kind labels for STRUCTURE.md domain items table
[domain_kinds]
pass = "🧩 compiler pass"

# Known macros for DESIGN.md table (description | usage)
[known_macros]

# Crate header colors for dependency graph (bg_color | fg_color).
# Populated once crate names are decided.
[crate_colors]
# ---------------------------------------------------------------------------
# Lint configuration
#
# Most crate-specific lints (no-unsafe, no-dyn, no-unwrap, compiler-phase
# layering via forbidden-imports, no-game-vocabulary, no-substrate-reimpl,
# strict-posture) are DEFERRED to post-R1-R4: the crate split has to land
# before they can scope correctly. Today's config covers universal
# mockspace built-ins that work regardless of crate layout.
# ---------------------------------------------------------------------------

[lints.no-empty-crate]
commit = "off"
build = "warn"
push = "warn"

[lints.no-todo]
commit = "off"
build = "warn"
push = "error"

[lints.file-size]
commit = "off"
build = "warn"
push = "error"
max_lines = "400"

[lints.undocumented-type]
commit = "off"
build = "warn"
push = "warn"

# --- Drift-catching primitive-vocabulary lints (task #84) ------------------
# Commit + push gates are `error` post-#73 / #130 (primitives sweep
# completion). `build` stays `warn` for the cycle following the flip so
# intermediate branch work surfaces the rule without hard-blocking the
# compile loop.

[lints.no-bare-result]
commit = "warn"
build = "warn"
push = "warn"

[lints.no-bare-string]
commit = "error"
build = "error"
push = "error"

[lints.no-bare-vec]
commit = "warn"
build = "warn"
push = "warn"

# Commit + push gates are `error` post-#130. Drift sites all remediated
# or carved out (SHAME.md + trailing lint:allow with `tracked: #131`
# for the vehje-resolve collection-field skeleton storages).

[lints.no-bare-numeric]
commit = "error"
build = "error"
push = "error"

[lints.no-bare-option]
commit = "warn"
build = "warn"
push = "warn"

[lints.arvo-types-only]
commit = "error"
build = "error"
push = "error"

[lints.no-public-raw-field]
commit = "error"
build = "error"
push = "error"

[lints.no-box]
commit = "warn"
build = "warn"
push = "warn"

[lints.no-float]
commit = "warn"
build = "warn"
push = "warn"

# Post-hilavitkutin-str crates (vehje consumes Str interning) must
# not introduce bare `const NAME: &str` / `static NAME: &str`. The
# replacement is `hilavitkutin_str::Str::const!()`. Commit + push
# gates are `error` post-#130 / #125.
[lints.no-bare-static-str]
commit = "warn"
build = "warn"
push = "warn"

# --- Layer enforcement via forbidden-imports (task #78) --------------------
#
# Closes the gap where `extern crate alloc; use alloc::vec::Vec;` compiled
# clean in the front-end no_std crates. Commit + push gates are `error`
# post-#130. `build` stays `warn` for the cycle following the flip.

[lints.forbidden-imports]
commit = "error"
build = "warn"
push = "error"
rules = [
  { scope = "vehje-ir", forbidden = "alloc::*, std::*", reason = "vehje-ir is no_std + no_alloc" },
  { scope = "vehje-lex", forbidden = "alloc::*, std::*", reason = "vehje-lex is no_std + no_alloc" },
  { scope = "vehje-syntax", forbidden = "alloc::*, std::*", reason = "vehje-syntax is no_std + no_alloc. the front-end produces IR only, never runtime state" },

  # Universal: runtime crates guard against hidden syscalls sneaking
  # through the C ABI boundary.
  { scope = "vehje-runtime-abi", forbidden = "std::thread::*, std::fs::*, std::net::*, std::io::*, std::process::*", reason = "vehje-runtime-abi is the C ABI surface; syscalls belong above/below it, not inside" },
]

# --- Built-in mockspace lints that don't apply to vehje --------------------
# Disables a family of lints carried over from loimu (the original home of
# mockspace) that encode loimu's plugin / registrable / visibility-macro
# conventions. Matches the disables in hilavitkutin and saalis
# mockspace.toml.

[lints.no-bare-pub]
commit = "off"
build = "off"
push = "off"

[lints.registrable-completeness]
commit = "off"
build = "off"
push = "off"

[lints.no-bare-macro-types]
commit = "off"
build = "off"
push = "off"

[lints.no-manual-id]
commit = "off"
build = "off"
push = "off"

[lints.no-primitive-key]
commit = "off"
build = "off"
push = "off"

[lints.no-raw-error-outside-primitives]
commit = "off"
build = "off"
push = "off"

[lints.no-self-define]
commit = "off"
build = "off"
push = "off"

[lints.no-pool-access]
commit = "off"
build = "off"
push = "off"

[lints.no-adhoc-error-enum]
commit = "off"
build = "off"
push = "off"

[lints.no-adhoc-framework]
commit = "off"
build = "off"
push = "off"

[lints.no-entry-suffix]
commit = "off"
build = "off"
push = "off"

# Pack lints (from mockspace-hilavitkutin-stack-lints): graceful ramp.
# These fire against pre-existing skeleton code that will be fixed in the
# vehje sweep (#73). Set to advisory during the sweep, flip to error
# afterwards. Entries here only, no duplicates of the builtin lints
# above (no-bare-result / no-bare-string / no-bare-vec / forbidden-imports
# already have their own overrides).
[lints.lint-allow-requires-task-id]
severity = "advisory"

[lints.no-alloc]
severity = "advisory"

[lints.no-std]
severity = "advisory"

[lints.trait-first-signatures]
severity = "advisory"

[lints.no-dyn-dispatch]
severity = "advisory"

[lints.no-runtime-spawn]
severity = "advisory"

[lints.no-runtime-registration]
severity = "advisory"

[lints.no-vec-in-trait-sig]
severity = "advisory"

[lints.strategy-marker-required]
severity = "advisory"

# ---------------------------------------------------------------------------
# External lint packs (mockspace #94 feature)
# ---------------------------------------------------------------------------
#
# Git-based dep spec only. Committed config must be portable.

# Writing-style gate. Pre-existing docs trip this until sweeps tidy them.
[lints.writing-style]
severity = "advisory"

[lint-crates]
mockspace-extra-lints = { git = "ssh://git@github.com/orgrinrt/mockspace-hilavitkutin-stack-lints.git", branch = "dev" }
