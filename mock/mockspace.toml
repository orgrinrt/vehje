project_name = "clause"
crate_prefix = "clause"
abi_version = 1

proc_macro_crates = []
module_crates = []

# Which macro to track per-crate in domain items
primary_domain_macro = "pass"
primary_domain_label = "Passes"

# Layer labels by depth index. R1 finalised the 8-crate compiler
# split (clause-ir, lex, syntax, resolve, typecheck, schedule,
# codegen, clause binary). Runtime split lands with R2.
layers = [
    "IR",         # clause-ir
    "Lex",        # clause-lex
    "Syntax",     # clause-syntax
    "Resolve",    # clause-resolve
    "TypeCheck",  # clause-typecheck
    "Schedule",   # clause-schedule
    "CodeGen",    # clause-codegen
    "CLI",        # clause (binary)
]

# Domain kind labels for STRUCTURE.md domain items table
[domain_kinds]
pass = "🧩 compiler pass"

# Known macros for DESIGN.md table (description | usage)
[known_macros]

# Crate header colors for dependency graph (bg_color | fg_color) —
# populated once crate names are decided.
[crate_colors]

# ---------------------------------------------------------------------------
# Lint configuration
#
# Most crate-specific lints (no-unsafe, no-dyn, no-unwrap, compiler-phase
# layering via forbidden-imports, no-game-vocabulary, no-substrate-reimpl,
# strict-posture) are DEFERRED to post-R1–R4 — the crate split has to land
# before they can scope correctly. Today's config covers universal
# mockspace built-ins that work regardless of crate layout.
# ---------------------------------------------------------------------------

[lints.no-empty-crate]
commit = "off"
build = "warn"
push = "warn"

[lints.no-todo]
commit = "off"
build = "warn"
push = "error"

[lints.file-size]
commit = "off"
build = "warn"
push = "error"
max_lines = "400"

[lints.undocumented-type]
commit = "off"
build = "warn"
push = "warn"

# --- Built-in mockspace lints that don't apply to clause -------------------
# Disables a family of lints carried over from loimu (the original home of
# mockspace) that encode loimu's plugin / registrable / visibility-macro
# conventions. clause has its own compiler-phase and no-unsafe / no-dyn
# custom lints (deferred to post-R1–R4). The loimu-ancestry lints are
# irrelevant here. Matches the disables in hilavitkutin and saalis
# mockspace.toml.

[lints.no-bare-pub]
commit = "off"
build = "off"
push = "off"

[lints.registrable-completeness]
commit = "off"
build = "off"
push = "off"

[lints.no-bare-macro-types]
commit = "off"
build = "off"
push = "off"

[lints.no-bare-result]
commit = "off"
build = "off"
push = "off"

[lints.no-bare-string]
commit = "off"
build = "off"
push = "off"

[lints.no-box]
commit = "off"
build = "off"
push = "off"

[lints.no-manual-id]
commit = "off"
build = "off"
push = "off"

[lints.no-primitive-key]
commit = "off"
build = "off"
push = "off"

[lints.no-raw-error-outside-primitives]
commit = "off"
build = "off"
