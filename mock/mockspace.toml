# Post-hilavitkutin-str crates (clause consumes Str interning) must
# not introduce bare `const NAME: &str` / `static NAME: &str`. The
# replacement is `hilavitkutin_str::Str::const!()`. Pre-sweep drift
# ramps to warn; flip to error alongside #73 completion (task #125).
[lints.no-bare-static-str]
commit = "off"
build = "warn"
push = "warn"

# --- Layer enforcement via forbidden-imports (task #78) --------------------
#
# Closes the gap where `extern crate alloc; use alloc::vec::Vec;` compiled
# clean in the front-end no_std crates. clause-ir, clause-lex, and
# clause-syntax are declared `#![no_std]` in their lib.rs but had no
# enforcement against reintroducing alloc/std via `extern crate`.
#
# Severity is WARN across all gates for the first shipping cycle so the
# clause-syntax drift (Vec<SyntaxError> return from parse()) surfaces as a
# warning without blocking the pipeline. The clause sweep (#73) will
# reshape the surface to trait-bound sinks, after which this lint upgrades
# to `build = "error", push = "error"` to match arvo / hilavitkutin.

[lints.forbidden-imports]
commit = "warn"
build = "warn"
push = "warn"
rules = [
    { scope = "clause-ir", forbidden = "alloc::*, std::*", reason = "clause-ir is no_std + no_alloc" },
    { scope = "clause-lex", forbidden = "alloc::*, std::*", reason = "clause-lex is no_std + no_alloc" },
    { scope = "clause-syntax", forbidden = "alloc::*, std::*", reason = "clause-syntax is no_std + no_alloc — the front-end produces IR only, never runtime state" },

    # Universal: runtime crates guard against hidden syscalls sneaking
    # through the C ABI boundary.
    { scope = "clause-runtime-abi", forbidden = "std::thread::*, std::fs::*, std::net::*, std::io::*, std::process::*", reason = "clause-runtime-abi is the C ABI surface; syscalls belong above/below it, not inside" },
]

# --- Built-in mockspace lints that don't apply to clause -------------------
# Disables a family of lints carried over from loimu (the original home of
# mockspace) that encode loimu's plugin / registrable / visibility-macro
