project_name = "clause"
crate_prefix = "clause"
abi_version = 1

proc_macro_crates = []
module_crates = []

# Which macro to track per-crate in domain items
primary_domain_macro = "pass"
primary_domain_label = "Passes"

# Layer labels by depth index. R1 finalised the 8-crate compiler
# split (clause-ir, lex, syntax, resolve, typecheck, schedule,
# codegen, clause binary). Runtime split lands with R2.
layers = [
    "IR",         # clause-ir
    "Lex",        # clause-lex
    "Syntax",     # clause-syntax
    "Resolve",    # clause-resolve
    "TypeCheck",  # clause-typecheck
    "Schedule",   # clause-schedule
    "CodeGen",    # clause-codegen
    "Rt:ABI",     # clause-runtime-abi
    "Rt:Driver",  # clause-runtime-driver
    "Rt:Tests",   # clause-runtime-tests
    "CLI",        # clause (binary)
]

# Domain kind labels for STRUCTURE.md domain items table
[domain_kinds]
pass = "🧩 compiler pass"

# Known macros for DESIGN.md table (description | usage)
[known_macros]

# Crate header colors for dependency graph (bg_color | fg_color) —
# populated once crate names are decided.
[crate_colors]

# ---------------------------------------------------------------------------
# Lint configuration
#
# Most crate-specific lints (no-unsafe, no-dyn, no-unwrap, compiler-phase
# layering via forbidden-imports, no-game-vocabulary, no-substrate-reimpl,
# strict-posture) are DEFERRED to post-R1–R4 — the crate split has to land
# before they can scope correctly. Today's config covers universal
# mockspace built-ins that work regardless of crate layout.
# ---------------------------------------------------------------------------

[lints.no-empty-crate]
commit = "off"
build = "warn"
push = "warn"

[lints.no-todo]
commit = "off"
build = "warn"
push = "error"

[lints.file-size]
commit = "off"
build = "warn"
push = "error"
max_lines = "400"

[lints.undocumented-type]
commit = "off"
build = "warn"
push = "warn"

