# under #73 (clause sweep, blocked on #72). Ramp to warn at every gate;
# FLIP BACK TO `error` once #73 completes.

[lints.no-bare-numeric]
commit = "off"
build = "warn"
push = "warn"

[lints.no-bare-option]
commit = "off"
build = "warn"
push = "warn"

[lints.arvo-types-only]
commit = "off"
build = "warn"
push = "warn"

[lints.no-public-raw-field]
commit = "off"
build = "warn"
push = "warn"

[lints.no-box]
commit = "off"
build = "warn"
push = "warn"

[lints.no-float]
