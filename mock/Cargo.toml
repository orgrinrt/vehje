[workspace]
resolver = "2"
members = [
    "crates/clause",
    "crates/clause-ir",
    "crates/clause-lex",
    "crates/clause-syntax",
    "crates/clause-resolve",
    "crates/clause-typecheck",
    "crates/clause-schedule",
    "crates/clause-codegen",
    "crates/clause-runtime-abi",
    "crates/clause-runtime-driver",
    "crates/clause-runtime-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
mockspace = { git = "ssh://git@github.com/hiisi-digital/mockspace.git", branch = "main" }

# Consumed substrate. Resolved to live git deps as the Vehje workspace
# grows into real crates.
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-bits = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-bitmask = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-graph = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-sparse = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-spectral = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }
arvo-comb = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev" }

hilavitkutin-api = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev" }
hilavitkutin = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev" }
hilavitkutin-build = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev" }
hilavitkutin-str = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev" }

notko = { git = "ssh://git@github.com/orgrinrt/notko.git", branch = "dev", default-features = false }

# In-workspace phase crates — path deps for inter-phase consumption.
vehje-ir = { path = "crates/clause-ir" }
vehje-lex = { path = "crates/clause-lex" }
vehje-syntax = { path = "crates/clause-syntax" }
vehje-resolve = { path = "crates/clause-resolve" }
vehje-typecheck = { path = "crates/clause-typecheck" }
vehje-schedule = { path = "crates/clause-schedule" }
vehje-codegen = { path = "crates/clause-codegen" }
vehje-runtime-abi = { path = "crates/clause-runtime-abi" }
vehje-runtime-driver = { path = "crates/clause-runtime-driver" }
vehje-runtime-tests = { path = "crates/clause-runtime-tests" }
