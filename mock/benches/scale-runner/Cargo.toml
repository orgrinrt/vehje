[workspace]
[package]
name = "vehje-scale-runner"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "vehje-scale-runner"
path = "src/main.rs"

[dependencies]
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", rev = "49ff5f55b8413f7046281ae1944130c10509c361", features = ["std"] }
vehje-bench-carrier = { path = "../carrier" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
