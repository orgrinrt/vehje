[workspace]
[package]
name = "carrier_native_real_copypatch"
version = "0.0.0"
edition = "2021"
publish = false
[lib]
name = "carrier_native_real_copypatch"
path = "src/lib.rs"
crate-type = ["cdylib"]
[dependencies]
mockspace-bench-core = { path = "../../../../../mockspace/bench-core", features = ["std"] }
mockspace-bench-macro = { path = "../../../../../mockspace/bench-macro" }
mockspace-bench-matrix = { path = "../../../../../mockspace/bench-matrix", default-features = false }
vehje-bench-carrier = { path = "../../carrier", features = ["jit"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
