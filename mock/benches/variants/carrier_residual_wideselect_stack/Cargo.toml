[workspace]
[package]
name = "carrier_residual_wideselect_stack"
version = "0.0.0"
edition = "2021"
publish = false
[lib]
name = "carrier_residual_wideselect_stack"
path = "src/lib.rs"
crate-type = ["cdylib"]
[dependencies]
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", rev = "688db96028fd0333576a9a704c199b22a6fd0d32", features = ["std"] }
mockspace-bench-macro = { git = "https://github.com/hiisi-digital/mockspace", rev = "688db96028fd0333576a9a704c199b22a6fd0d32" }
mockspace-bench-matrix = { git = "https://github.com/hiisi-digital/mockspace", rev = "688db96028fd0333576a9a704c199b22a6fd0d32", default-features = false }
vehje-bench-carrier = { path = "../../carrier" }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
