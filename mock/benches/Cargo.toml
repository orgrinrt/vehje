[workspace]
# carrier and every generated variant are their own workspace roots (variants are
# built in isolation, one cdylib each). Exclude them so this workspace does not try
# to absorb them as members; they remain usable as path dependencies.
exclude = ["carrier", "carrier-runtime", "variants"]

[package]
name = "vehje-benches"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "vehje-benches"
path = "src/main.rs"

[dependencies]
# Pinned to the mockspace dev rev that landed the semantic-matrix layer (the
# extended FfiBenchCall ABI + abi_hash + bench_matrix). The runner, the gen_matrix
# generator, the carrier, and every generated variant must all resolve the SAME
# bench-core rev, or a variant is rejected at dlopen by the runner's abi_hash check;
# the variant extra_deps in carrier/src/bench/mod.rs pin the identical rev.
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", rev = "98031e439bc0a5eeb658065b2b54cac80b7b644d", features = ["std"] }
mockspace-bench-harness = { git = "https://github.com/hiisi-digital/mockspace", rev = "98031e439bc0a5eeb658065b2b54cac80b7b644d" }
mockspace-bench-macro = { git = "https://github.com/hiisi-digital/mockspace", rev = "98031e439bc0a5eeb658065b2b54cac80b7b644d" }
# the semantic-matrix layer: gen_matrix calls its `generate_all` over the
# carrier's `all_matrix_decls()`. Default features (generate) pull the harness
# transport the generator needs.
mockspace-bench-matrix = { git = "https://github.com/hiisi-digital/mockspace", rev = "98031e439bc0a5eeb658065b2b54cac80b7b644d" }
vehje-bench-carrier = { path = "carrier" }

[features]
# Enables the kperf PMU path (instructions/cycles columns). The driver must be
# built with this feature AND run with MOCKSPACE_BENCH_PERF=1 under sudo for the
# columns to populate; without it they stay zero (wall-clock only).
perf-counters = ["mockspace-bench-harness/perf-counters"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
