[package]
name = "vehje-runtime-driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo.workspace = true
vehje-ir.workspace = true
vehje-runtime-abi.workspace = true
vehje-schedule.workspace = true
hilavitkutin-api.workspace = true
notko.workspace = true
# libloading = "0.8"  # BACKLOG: dlopen integration for dynamic Zig runtime loading

[build-dependencies]
mockspace.workspace = true

[features]
default = ["std"]
# `std` is the baseline feature: the driver opens the Zig runtime
# dylib via `std::fs` and (future) `libloading`. `no_std` mode is
# reserved for the embedded-target future where dylib dispatch is
# replaced with statically linked extension slots.
std = []
