[package]
name = "vehje-runtime-driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo.workspace = true
vehje-ir.workspace = true
vehje-runtime-abi.workspace = true
vehje-schedule.workspace = true
hilavitkutin-api.workspace = true
hilavitkutin-linking = { workspace = true, optional = true }
notko.workspace = true

[features]
default = ["std"]
# The embedding does not need `std`: loading goes through
# `hilavitkutin-linking`, which is `no_std` and holds no allocator.
# The feature remains for host-side conveniences that may want it.
std = []
# Load the runtime artifact at run time instead of linking it. Off by
# default: the shipping compiler links statically and carries no loader.
dynamic = ["dep:hilavitkutin-linking"]
