[package]
name = "vehje-runtime-abi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo.workspace = true
vehje-ir.workspace = true

[build-dependencies]
mockspace.workspace = true

[features]
default = []

[lib]
# rlib for now: downstream Rust crates (vehje-runtime-driver) depend on
# the type surface directly. The cdylib export of the `extern "C"` entry
# points (which needs the no_std panic-handler story) is restored when
# the tier-0 serialization and the ABI functions land (M3).
crate-type = ["rlib"]
